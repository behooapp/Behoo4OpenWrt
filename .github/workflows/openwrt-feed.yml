name: Publish OpenWrt feed

on:
  push:
    branches: [main]
    paths: [.github/workflows/openwrt-feed.yml, install.sh]
  workflow_dispatch:

concurrency:
  group: openwrt-feed
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      installer_sha: ${{ steps.installer.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Download and verify the signed feed
        id: installer
        env:
          GH_TOKEN: ${{ github.token }}
          FEED_TAG: '0.1.3'
          SHA256: cfd66ae4a3d7b103f3efe257e258d0abf72300d46b2b41dffe33e06c7f7cd06b
          AARCH64_SHA256: 2ec658058ccc82486c991e732957388d6c55840ed24a0e7eb9e58e401c91e031
        run: |
          set -euo pipefail
          archive="behoo-openwrt-feed-$FEED_TAG.tar.gz"
          gh release download "$FEED_TAG" --repo "$GITHUB_REPOSITORY" --pattern "$archive"
          printf '%s  %s\n' "$SHA256" "$archive" | sha256sum -c -
          addon="behoo-openwrt-apk-aarch64-$FEED_TAG.tar.gz"
          gh release download "$FEED_TAG" --repo "$GITHUB_REPOSITORY" --pattern "$addon"
          printf '%s  %s\n' "$AARCH64_SHA256" "$addon" | sha256sum -c -
          mkdir _site
          tar -xzf "$archive" -C _site
          tar -xzf "$addon" -C _site
          cp install.sh _site/install.sh
          sh -n _site/install.sh
          printf 'sha=%s\n' "$(sha256sum _site/install.sh | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
          test -s _site/feed/apk/x86_64/packages.adb
          test -s _site/feed/fw4/x86_64/Packages.sig
          test -s _site/feed/fw3/x86_64/Packages.sig
      - name: Test APK 25.12.6 and both opkg feeds
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/behoo-openwrt-test"
          mkdir "$work"
          sdk=openwrt-sdk-25.12.6-x86-64_gcc-14.3.0_musl.Linux-x86_64.tar.zst
          curl -fLsS --retry 3 -o "$work/sdk.tar.zst" "https://downloads.openwrt.org/releases/25.12.6/targets/x86/64/$sdk"
          printf '%s  %s\n' 1864152619092e781fa36a401960c8e9ae42d6a364c44ee5f0b197ca5f3c0fcc "$work/sdk.tar.zst" | sha256sum -c -
          mkdir "$work/sdk"
          tar --zstd -xf "$work/sdk.tar.zst" --strip-components=1 -C "$work/sdk"
          apk="$work/sdk/staging_dir/host/bin/apk"
          usign="$work/sdk/staging_dir/host/bin/usign"
          for index in _site/feed/fw3/*/Packages.gz _site/feed/fw4/*/Packages.gz; do
            gzip -dc "$index" > "$work/Packages"
            "$usign" -V -p _site/keys/behoo-opkg.pub -m "$work/Packages" -x "${index%.gz}.sig"
          done
          repo=_site/feed/apk/aarch64
          "$apk" --keys-dir "$PWD/_site/keys" verify "$repo/packages.adb" "$repo/luci-app-behoo-0.1.3-r1.apk"
          mkdir -p "$work/root/etc/apk/keys" "$work/fetched"
          sudo "$apk" --root "$work/root" --arch aarch64 --no-network add --initdb
          cp _site/keys/behoo-openwrt.pem "$work/root/etc/apk/keys/"
          python3 -m http.server 18735 --bind 127.0.0.1 --directory _site &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          url=http://127.0.0.1:18735/feed/apk/aarch64/packages.adb
          curl -fsS --retry 5 --retry-connrefused "$url" -o /dev/null
          printf '%s\n' "$url" > "$work/root/etc/apk/repositories"
          "$apk" --root "$work/root" --arch aarch64 --no-cache fetch --output "$work/fetched" luci-app-behoo
          cmp "$repo/luci-app-behoo-0.1.3-r1.apk" "$work/fetched/"*.apk
      - name: Test apk add with the package database from official ARM64 firmware
        run: |
          set -euo pipefail
          # Reuse the same SDK tools as the feed check on this runner.
          work="$RUNNER_TEMP/behoo-openwrt-test"
          apk="$work/sdk/staging_dir/host/bin/apk"
          firmware=openwrt-25.12.6-bcm27xx-bcm2711-rpi-4-ext4-factory.img.gz
          curl -fLsS --retry 3 -o "$work/$firmware" "https://downloads.openwrt.org/releases/25.12.6/targets/bcm27xx/bcm2711/$firmware"
          printf '%s  %s\n' 90f6cf7a2fd7e3bf2eab060c7460612be7b43c0c3e075fad01ac80a70a41a917 "$work/$firmware" | sha256sum -c -
          # This image's root filesystem starts at 72 MiB.
          gzip -dc "$work/$firmware" > "$work/firmware.img"
          dd if="$work/firmware.img" of="$work/root.ext4" bs=1M skip=72 status=none
          root="$work/firmware-root"
          mkdir -p "$root/etc/apk" "$root/lib/apk/db"
          for path in /etc/apk/arch /etc/apk/world /lib/apk/db/installed; do
            debugfs -R "dump $path $root$path" "$work/root.ext4"
            test -s "$root$path"
          done
          keys="$PWD/_site/keys"
          package=luci-app-behoo
          wrong_repo="$PWD/_site/feed/apk/aarch64/packages.adb"
          if sudo "$apk" --root "$root" --no-network --no-cache --keys-dir "$keys" --repository "$wrong_repo" add --simulate "$package" > "$work/rejected.log" 2>&1; then
            cat "$work/rejected.log"
            exit 1
          fi
          cat "$work/rejected.log"
          grep -F 'error: uninstallable' "$work/rejected.log"
          arch=$(awk 'NF { print $1; exit }' "$root/etc/apk/arch")
          test "$arch" = aarch64_cortex-a72
          mkdir "$work/staged"
          cp _site/feed/apk/"$arch"/packages.adb _site/feed/apk/"$arch"/luci-app-behoo-*.apk "$work/staged/"
          "$apk" --keys-dir "$keys" verify "$work/staged/packages.adb" "$work/staged/"*.apk
          # Install in the disposable database without running router service hooks.
          sudo "$apk" --root "$root" --no-network --no-cache --no-scripts --keys-dir "$keys" --repository "$work/staged/packages.adb" add "$package"
          sudo "$apk" --root "$root" info --exists "$package"
          grep -Fx "$package" "$root/etc/apk/world"
      - name: Run the one-line installer on official OpenWrt 21.02 to 24.10 systems
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/behoo-openwrt-test/opkg"
          mkdir -p "$work"
          base=http://127.0.0.1:18736
          python3 -m http.server 18736 --bind 127.0.0.1 --directory _site &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          curl -fsS --retry 5 --retry-connrefused "$base/install.sh" -o /dev/null
          # Point only the Behoo URL at the signed feed about to be published.
          sed "s|https://behooapp.github.io/Behoo4OpenWrt|$base|" _site/install.sh > "$work/install.sh"
          while read -r version flavor digest; do
            echo "::group::OpenWrt $version with $flavor"
            (
              root="$work/$version/root"
              image="$work/$version/rootfs.img"
              mkdir -p "$root"
              url="https://downloads.openwrt.org/releases/$version/targets/x86/64/openwrt-$version-x86-64-generic-ext4-rootfs.img.gz"
              curl -fLsS --retry 3 -o "$image.gz" "$url"
              printf '%s  %s\n' "$digest" "$image.gz" | sha256sum -c -
              gzip -d "$image.gz"
              sudo mount -o loop "$image" "$root"
              trap 'sudo umount "$root"' EXIT
              sudo rm -f "$root/etc/resolv.conf"
              sudo cp -L /etc/resolv.conf "$root/etc/resolv.conf"
              for device in null urandom; do
                if [ ! -e "$root/dev/$device" ]; then
                  minor=3
                  if [ "$device" = urandom ]; then minor=9; fi
                  sudo mknod -m 666 "$root/dev/$device" c 1 "$minor"
                fi
              done
              # Use the real opkg solver and unpacker with service hooks disabled.
              opkg=$(sudo chroot "$root" /bin/sh -c 'command -v opkg')
              sudo mkdir -p "$root/tmp/behoo-test"
              printf '#!/bin/sh\nexec %s --offline-root / "$@"\n' "$opkg" | sudo tee "$root/tmp/behoo-test/opkg" >/dev/null
              sudo chmod +x "$root/tmp/behoo-test/opkg"
              sudo cp "$work/install.sh" "$root/tmp/behoo-test/install.sh"
              sudo timeout 120 chroot "$root" /bin/sh -c 'PATH=/tmp/behoo-test:$PATH sh /tmp/behoo-test/install.sh'
              sudo chroot "$root" "$opkg" status luci-app-behoo | grep '^Status: .* installed
        with:
          path: _site

  deploy:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy OpenWrt feed
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify the public installer and aarch64 index
        env:
          PAGES_URL: ${{ steps.deployment.outputs.page_url }}
          INSTALLER_SHA: ${{ needs.package.outputs.installer_sha }}
        run: |
          installer="${PAGES_URL%/}/install.sh?rev=$GITHUB_SHA"
          curl -fsSL --retry 8 --retry-delay 3 --retry-all-errors "$installer" -o install.sh
          printf '%s  %s\n' "$INSTALLER_SHA" install.sh | sha256sum -c -
          url="${PAGES_URL%/}/feed/apk/aarch64/packages.adb?rev=$GITHUB_SHA"
          curl -fsSL --retry 8 --retry-delay 3 --retry-all-errors "$url" -o packages.adb
          printf '%s  %s\n' d3dcc264c7ea12fe6c18a7d7b600fa7ee1d9783b3e46da3f155c8405b5444e20 packages.adb | sha256sum -c -

              grep -Fx "src/gz behoo $base/feed/$flavor/x86_64" "$root/etc/opkg/behoo.conf"
            )
            echo '::endgroup::'
          done <<'FIRMWARE'
          21.02.7 fw3 dc2a80437fcc70517ec2e4db778d01a284dc2c53eb00b1139b24b7fbe9cd639b
          22.03.7 fw4 536df49292c20f7a3edcf9a4da9db4025a69a3a25342ffefebb8176a85af12e6
          23.05.6 fw4 34ed161650aca0219dee3a90283f6234e21cbdeb17a4cec66c48d6a0021e26fc
          24.10.8 fw4 cf39cd1043fbff86ad2936c951fd6afe607437acf3531082cf11b20febc95b03
          FIRMWARE
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy OpenWrt feed
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify the public installer and aarch64 index
        env:
          PAGES_URL: ${{ steps.deployment.outputs.page_url }}
          INSTALLER_SHA: ${{ needs.package.outputs.installer_sha }}
        run: |
          installer="${PAGES_URL%/}/install.sh?rev=$GITHUB_SHA"
          curl -fsSL --retry 8 --retry-delay 3 --retry-all-errors "$installer" -o install.sh
          printf '%s  %s\n' "$INSTALLER_SHA" install.sh | sha256sum -c -
          url="${PAGES_URL%/}/feed/apk/aarch64/packages.adb?rev=$GITHUB_SHA"
          curl -fsSL --retry 8 --retry-delay 3 --retry-all-errors "$url" -o packages.adb
          printf '%s  %s\n' d3dcc264c7ea12fe6c18a7d7b600fa7ee1d9783b3e46da3f155c8405b5444e20 packages.adb | sha256sum -c -
